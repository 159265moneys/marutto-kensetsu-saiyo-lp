<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>まるっと建設採用｜建設業界特化の定額制採用代行</title>
    <meta
      name="description"
      content="まるっと建設採用は、施工管理・現場監督・職人・有資格者採用の応募獲得を定額で支援する建設業界特化の採用代行サービスです。"
    >
    <link rel="stylesheet" href="styles.css?v=20260611-image-lp-1">
  </head>
  <body>
    <main class="page-shell">
      <img class="lp-img" src="assets/lp/01-fv-main.png" alt="施工管理・現場監督・職人採用・有資格者採用 応募100人かける応募単価1000円で10万円">
      <img class="lp-img" src="assets/lp/02-fv-badges.png" alt="定額10万円台から、成果報酬0円、最短3日開始、月100応募も狙える">
      <a href="#entry" aria-label="建設採用の戦略相談を受ける">
        <img class="lp-img" src="assets/lp/03-cta.png" alt="初月限定 最大10万円割引 建設採用の戦略相談を受ける">
      </a>
      <img class="lp-img" src="assets/lp/04-doubt.png" alt="これ以上、採用に時間とお金を犠牲にするの、もう終わりにしませんか">
      <img class="lp-img" src="assets/lp/05-proof.png" alt="まるっと建設採用の支援実績と応募単価例">
      <img class="lp-img" src="assets/lp/06-worries.png" alt="建設採用でよくある悩み">
      <img class="lp-img" src="assets/lp/07-solution.png" alt="まるっと建設採用が建設採用の悩みを10万円台から解決できちゃうかも">
      <a href="#entry" aria-label="無料相談を予約する">
        <img class="lp-img" src="assets/lp/03-cta.png" alt="建設採用の無料相談を予約する">
      </a>
      <img class="lp-img" src="assets/lp/08-jobs.png" alt="建設業界の対応職種">
      <img class="lp-img" src="assets/lp/09-secrets.png" alt="まるっと建設採用が選ばれる秘訣3選">
      <img class="lp-img" src="assets/lp/10-reason-methods.png" alt="建設採用に強い理由と13の採用手法">
      <img class="lp-img" src="assets/lp/11-voices-plan.png" alt="お客様の声と月額10万円からの料金プラン">
      <a href="#entry" aria-label="採用戦略相談を受ける">
        <img class="lp-img" src="assets/lp/03-cta.png" alt="初月限定 最大10万円割引 採用戦略相談を受ける">
      </a>
      <img class="lp-img" src="assets/lp/12-faq-final.png" alt="よくある質問">

      <section class="entry" id="entry">
        <h2>無料相談・資料請求</h2>
        <form action="mailto:contact@example.com" method="post" enctype="text/plain">
          <label>
            <span>会社名</span>
            <input name="company" type="text" placeholder="株式会社まるっと建設">
          </label>
          <label>
            <span>お名前</span>
            <input name="name" type="text" placeholder="山田 太郎">
          </label>
          <label>
            <span>メールアドレス</span>
            <input name="email" type="email" placeholder="sample@example.com">
          </label>
          <label>
            <span>採用したい職種</span>
            <select name="job">
              <option>施工管理</option>
              <option>現場監督</option>
              <option>職人・技能工</option>
              <option>電気工事士</option>
              <option>設計・CAD</option>
              <option>その他</option>
            </select>
          </label>
          <label>
            <span>相談内容</span>
            <textarea name="message" rows="5" placeholder="採用エリア、人数、困っていることなど"></textarea>
          </label>
          <button type="submit">送信する</button>
        </form>
      </section>
    </main>
  </body>
</html>
